        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartLessonAttemptInput'}
      responses:
        '201':
          description: Estado atual da tentativa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LessonAttemptView'}
  /lesson-attempts/{attemptId}:
    get:
      summary: Retomar estado persistido da tentativa
      operationId: getLessonAttempt
      parameters:
        - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Estado atual
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LessonAttemptView'}
        '404': {$ref: '#/components/responses/Problem'}
  /lesson-attempts/{attemptId}/actions:
    post:
      summary: Submeter ação para avaliação autoritativa
      operationId: submitLessonAction
      parameters:
        - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
