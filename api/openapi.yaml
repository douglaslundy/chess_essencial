openapi: 3.1.0
info:
  title: Xadrez Essencial API
  version: 1.1.0
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Verificar saúde da API
      operationId: getHealth
      responses:
        '200':
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      security: []
      summary: Cadastrar usuário
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Usuário pendente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/resend-verification:
    post:
      security: []
      summary: Reenviar e-mail de verificação sem revelar a existência da conta
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationInput'
      responses:
        '204':
          description: Solicitação processada
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/verify:
    post:
      security: []
      summary: Confirmar e-mail pelo token enviado ao usuário
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: Usuário ativado
        '401': {$ref: '#/components/responses/Problem'}
  /auth/password/forgot:
    post:
      security: []
      summary: Request a password reset without revealing account existence
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '204':
          description: Request processed
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/password/reset:
    post:
      security: []
      summary: Replace the password with a single-use reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '204':
          description: Password replaced and sessions revoked
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      security: []
      summary: Autenticar
      operationId: login
      parameters:
        - {$ref: '#/components/parameters/WebClientHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly quando X-Xadrez-Client for web
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      security: []
      summary: Rotacionar refresh token
      operationId: refresh
      parameters:
        - {$ref: '#/components/parameters/WebClientHeader'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: false
        description: Refresh token no corpo para clientes Bearer; web usa o cookie HttpOnly
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/RefreshInput'}
                - {type: object, maxProperties: 0}
      responses:
        '200':
          description: Tokens rotacionados
          headers:
            Set-Cookie:
              description: Refresh token HttpOnly rotacionado para clientes web
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      security: []
      summary: Revogar sessão
      operationId: logout
      parameters:
        - {$ref: '#/components/parameters/WebClientHeader'}
        - {$ref: '#/components/parameters/CsrfHeader'}
      requestBody:
        required: false
        description: Refresh token no corpo para clientes Bearer; web usa o cookie HttpOnly
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/RefreshInput'}
                - {type: object, maxProperties: 0}
      responses:
        '204':
          description: Sessão revogada ou já ausente
          headers:
            Set-Cookie:
              description: Expira o cookie de refresh do cliente web
              schema: {type: string}
  /me:
    get:
      summary: Perfil autenticado
      operationId: getMe
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Atualizar perfil e configurações
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeInput'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /subscription-plans:
    get:
      summary: List active subscription plans (public catalog)
      operationId: listActiveSubscriptionPlans
      responses:
        '200':
          description: Active plans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionPlanList'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/metrics:
    get:
      summary: Métricas de desempenho do jogador (partidas, tempo, qualidade dos lances, pontos fortes e fracos)
      operationId: getMyMetrics
      responses:
        '200':
          description: Métricas do jogador
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerMetrics'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/study-progress/{kind}/{itemId}:
    put:
      summary: Marcar um exercício como resolvido ou uma partida da biblioteca como assistida (idempotente)
      operationId: markStudyItemDone
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [exercise, game]}}
        - {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Marcado}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /me/subscription:
    get:
      summary: Get the current user's active subscription, if any
      operationId: getMySubscription
      responses:
        '200':
          description: Active subscription (all fields null when there is none)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSubscription'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/subscription/payments:
    get:
      summary: Listar pagamentos da assinatura do usuário
      operationId: getMySubscriptionPayments
      responses:
        '200':
          description: Pagamentos da assinatura
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionPaymentList'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/subscription/checkout:
    post:
      summary: Start a Mercado Pago checkout for a subscription plan
      operationId: createSubscriptionCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckoutInput'}
      responses:
        '200':
          description: Checkout URL to redirect the payer to
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /webhooks/mercado-pago:
    post:
      summary: Mercado Pago payment/subscription webhook (called by Mercado Pago, not the app)
      operationId: receiveMercadoPagoWebhook
      security: []
      responses:
        '200': {description: Notification processed}
        '401': {$ref: '#/components/responses/Problem'}
  /me/referral:
    get:
      summary: Get the current user's referral code and stats
      operationId: getMyReferral
      responses:
        '200':
          description: Referral code and stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyReferralInfo'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/avatar:
    post:
      summary: Upload a profile avatar (base64 image) to object storage
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadAvatarInput'}
      responses:
        '201':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /presence/heartbeat:
    post:
      summary: Signal that the current user is online
      operationId: heartbeat
      responses:
        '204': {description: Recorded}
        '401': {$ref: '#/components/responses/Problem'}
  /friends:
    get:
      summary: List accepted friends with presence
      operationId: listFriends
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Friend'}}
        '401': {$ref: '#/components/responses/Problem'}
  /friends/requests:
    get:
      summary: List incoming and outgoing pending friend requests
      operationId: listFriendRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestsView'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      summary: Send a friend request by username
      operationId: sendFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendFriendRequestInput'}
      responses:
        '201':
          description: Created request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}/accept:
    post:
      summary: Accept a pending incoming friend request
      operationId: acceptFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '201':
          description: New friend
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Friend'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}/decline:
    post:
      summary: Decline a pending incoming friend request
      operationId: declineFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Declined}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}:
    delete:
      summary: Cancel a pending outgoing friend request
      operationId: cancelFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Cancelled}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/{userId}:
    delete:
      summary: Remove an accepted friend
      operationId: removeFriend
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /users/{username}:
    get:
      summary: Public profile with presence, ratings and friendship status
      operationId: getPublicProfile
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProfile'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /messages/conversations:
    get:
      summary: List conversations with accepted friends, most recent first
      operationId: listConversations
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        '401': {$ref: '#/components/responses/Problem'}
  /messages/{friendUserId}:
    get:
      summary: List the direct message history with a friend (marks it read)
      operationId: listMessages
      parameters:
        - {name: friendUserId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: before, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Messages, oldest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DirectMessage'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      summary: Send a direct message to a friend
      operationId: sendMessage
      parameters:
        - {name: friendUserId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageInput'}
      responses:
        '201':
          description: Sent message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectMessage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /feed:
    get:
      summary: List the viewer's feed (own posts plus accepted friends' posts)
      operationId: listFeed
      parameters:
        - {name: before, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Post'}}
        '401': {$ref: '#/components/responses/Problem'}
  /posts:
    post:
      summary: Create a post (text, photo, or both)
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePostInput'}
      responses:
        '201':
          description: Created post
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Post'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /posts/photo:
    post:
      summary: Upload a post photo (base64 image) to object storage
      operationId: uploadPostPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadPostPhotoInput'}
      responses:
        '201':
          description: Uploaded photo URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPostPhotoResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /posts/{postId}:
    delete:
      summary: Delete one of your own posts
      operationId: deletePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /posts/{postId}/like:
    post:
      summary: Like a post
      operationId: likePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Updated post
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Post'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Remove your like from a post
      operationId: unlikePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Unliked}
        '401': {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      summary: Expor métricas agregadas no formato Prometheus
      operationId: getMetrics
      responses:
        '200':
          description: Métricas agregadas sem dados pessoais
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
  /me/privacy:
    get:
      summary: Consultar controles de privacidade
      operationId: getPrivacy
      responses:
        '200':
          description: Preferências atuais
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacySettings'}
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Atualizar controles de privacidade
      operationId: updatePrivacy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePrivacyInput'}
      responses:
        '200':
          description: Preferências atualizadas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacySettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /admin/users:
    get:
      summary: List platform users (admin only)
      operationId: adminListUsers
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, active, suspended, deleted]}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: offset, in: query, required: false, schema: {type: integer}}
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserList'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/reports:
    get:
      summary: List moderation reports (admin only)
      operationId: adminListReports
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/ModerationReportStatus'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Moderation queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationReportList'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/reports/{reportId}:
    parameters:
      - {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get a report and its decision history (admin only)
      operationId: adminGetReport
      responses:
        '200':
          description: Moderation report detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationReportDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Triage or close a moderation report (admin only)
      operationId: adminModerateReport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModerateReportInput'}
      responses:
        '200':
          description: Updated moderation report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationReportDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/bots/stats:
    get:
      summary: Bot persona fleet stats (admin only)
      operationId: adminGetBotStats
      responses:
        '200':
          description: Bot persona stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBotStats'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/bots/online:
    get:
      summary: Bot personas currently online (admin only)
      operationId: adminListOnlineBots
      responses:
        '200':
          description: Bot personas online right now
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminOnlineBot'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/metrics:
    get:
      summary: Aggregated platform metrics (admin only)
      operationId: adminGetMetrics
      responses:
        '200':
          description: Platform metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMetrics'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/settings/smtp:
    get:
      summary: Get SMTP settings (admin only)
      operationId: adminGetSmtpSettings
      responses:
        '200':
          description: Current SMTP settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmtpSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      summary: Update SMTP settings (admin only)
      operationId: adminUpdateSmtpSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSmtpSettingsInput'}
      responses:
        '200':
          description: Updated SMTP settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmtpSettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/settings/smtp/test-email:
    post:
      summary: Send a test email using the configured SMTP settings (admin only)
      operationId: adminSendSmtpTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendTestEmailInput'}
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /admin/settings/mercado-pago:
    get:
      summary: Get Mercado Pago payment settings (admin only)
      operationId: adminGetMercadoPagoSettings
      responses:
        '200':
          description: Current Mercado Pago settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MercadoPagoSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      summary: Update Mercado Pago payment settings (admin only)
      operationId: adminUpdateMercadoPagoSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMercadoPagoSettingsInput'}
      responses:
        '200':
          description: Updated Mercado Pago settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MercadoPagoSettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
