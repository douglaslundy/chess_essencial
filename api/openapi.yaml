openapi: 3.1.0
info:
  title: Xadrez Essencial API
  version: 1.1.0
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Verificar saúde da API
      operationId: getHealth
      responses:
        '200':
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      security: []
      summary: Cadastrar usuário
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Usuário pendente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/resend-verification:
    post:
      security: []
      summary: Reenviar e-mail de verificação sem revelar a existência da conta
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationInput'
      responses:
        '204':
          description: Solicitação processada
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/verify:
    post:
      security: []
      summary: Confirmar e-mail pelo token enviado ao usuário
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '200':
          description: Usuário ativado
        '401': {$ref: '#/components/responses/Problem'}
  /auth/password/forgot:
    post:
      security: []
      summary: Request a password reset without revealing account existence
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '204':
          description: Request processed
        '400': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/password/reset:
    post:
      security: []
      summary: Replace the password with a single-use reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '204':
          description: Password replaced and sessions revoked
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      security: []
      summary: Autenticar
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      security: []
      summary: Rotacionar refresh token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Tokens rotacionados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      security: []
      summary: Revogar sessão
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '204':
          description: Sessão revogada ou já ausente
  /me:
    get:
      summary: Perfil autenticado
      operationId: getMe
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Atualizar perfil e configurações
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeInput'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/avatar:
    post:
      summary: Upload a profile avatar (base64 image) to object storage
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadAvatarInput'}
      responses:
        '201':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /presence/heartbeat:
    post:
      summary: Signal that the current user is online
      operationId: heartbeat
      responses:
        '204': {description: Recorded}
        '401': {$ref: '#/components/responses/Problem'}
  /friends:
    get:
      summary: List accepted friends with presence
      operationId: listFriends
      responses:
        '200':
          description: Friends
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Friend'}}
        '401': {$ref: '#/components/responses/Problem'}
  /friends/requests:
    get:
      summary: List incoming and outgoing pending friend requests
      operationId: listFriendRequests
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestsView'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      summary: Send a friend request by username
      operationId: sendFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendFriendRequestInput'}
      responses:
        '201':
          description: Created request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequest'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}/accept:
    post:
      summary: Accept a pending incoming friend request
      operationId: acceptFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '201':
          description: New friend
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Friend'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}/decline:
    post:
      summary: Decline a pending incoming friend request
      operationId: declineFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Declined}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/requests/{username}:
    delete:
      summary: Cancel a pending outgoing friend request
      operationId: cancelFriendRequest
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Cancelled}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /friends/{userId}:
    delete:
      summary: Remove an accepted friend
      operationId: removeFriend
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /users/{username}:
    get:
      summary: Public profile with presence, ratings and friendship status
      operationId: getPublicProfile
      parameters:
        - {name: username, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProfile'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /messages/conversations:
    get:
      summary: List conversations with accepted friends, most recent first
      operationId: listConversations
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        '401': {$ref: '#/components/responses/Problem'}
  /messages/{friendUserId}:
    get:
      summary: List the direct message history with a friend (marks it read)
      operationId: listMessages
      parameters:
        - {name: friendUserId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: before, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Messages, oldest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DirectMessage'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      summary: Send a direct message to a friend
      operationId: sendMessage
      parameters:
        - {name: friendUserId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageInput'}
      responses:
        '201':
          description: Sent message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectMessage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /feed:
    get:
      summary: List the viewer's feed (own posts plus accepted friends' posts)
      operationId: listFeed
      parameters:
        - {name: before, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Post'}}
        '401': {$ref: '#/components/responses/Problem'}
  /posts:
    post:
      summary: Create a post (text, photo, or both)
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePostInput'}
      responses:
        '201':
          description: Created post
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Post'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /posts/photo:
    post:
      summary: Upload a post photo (base64 image) to object storage
      operationId: uploadPostPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadPostPhotoInput'}
      responses:
        '201':
          description: Uploaded photo URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPostPhotoResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /posts/{postId}:
    delete:
      summary: Delete one of your own posts
      operationId: deletePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /posts/{postId}/like:
    post:
      summary: Like a post
      operationId: likePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Updated post
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Post'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Remove your like from a post
      operationId: unlikePost
      parameters:
        - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Unliked}
        '401': {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      summary: Expor métricas agregadas no formato Prometheus
      operationId: getMetrics
      responses:
        '200':
          description: Métricas agregadas sem dados pessoais
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
  /me/privacy:
    get:
      summary: Consultar controles de privacidade
      operationId: getPrivacy
      responses:
        '200':
          description: Preferências atuais
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacySettings'}
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Atualizar controles de privacidade
      operationId: updatePrivacy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePrivacyInput'}
      responses:
        '200':
          description: Preferências atualizadas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacySettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /admin/users:
    get:
      summary: List platform users (admin only)
      operationId: adminListUsers
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, active, suspended, deleted]}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: offset, in: query, required: false, schema: {type: integer}}
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserList'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/bots/stats:
    get:
      summary: Bot persona fleet stats (admin only)
      operationId: adminGetBotStats
      responses:
        '200':
          description: Bot persona stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBotStats'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/settings/smtp:
    get:
      summary: Get SMTP settings (admin only)
      operationId: adminGetSmtpSettings
      responses:
        '200':
          description: Current SMTP settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmtpSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      summary: Update SMTP settings (admin only)
      operationId: adminUpdateSmtpSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSmtpSettingsInput'}
      responses:
        '200':
          description: Updated SMTP settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmtpSettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/settings/smtp/test-email:
    post:
      summary: Send a test email using the configured SMTP settings (admin only)
      operationId: adminSendSmtpTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendTestEmailInput'}
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /admin/settings/mercado-pago:
    get:
      summary: Get Mercado Pago payment settings (admin only)
      operationId: adminGetMercadoPagoSettings
      responses:
        '200':
          description: Current Mercado Pago settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MercadoPagoSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      summary: Update Mercado Pago payment settings (admin only)
      operationId: adminUpdateMercadoPagoSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMercadoPagoSettingsInput'}
      responses:
        '200':
          description: Updated Mercado Pago settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MercadoPagoSettings'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/settings/mercado-pago/test-connection:
    post:
      summary: Verify the configured Mercado Pago access token (admin only)
      operationId: adminTestMercadoPagoConnection
      responses:
        '200':
          description: Connection verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MercadoPagoConnectionTestResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}/status:
    patch:
      summary: Change a user's status (admin only; delete is a reversible soft-delete)
      operationId: adminUpdateUserStatus
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAdminUserStatusInput'}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/blocks:
    get:
      summary: Listar usuários bloqueados
      operationId: listBlocks
      responses:
        '200':
          description: Bloqueios direcionais
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BlockedUser'}}
        '401': {$ref: '#/components/responses/Problem'}
  /me/blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      summary: Bloquear usuário
      operationId: blockUser
      responses:
        '204': {description: Usuário bloqueado}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Remover bloqueio
      operationId: unblockUser
      responses:
        '204': {description: Bloqueio removido ou já ausente}
        '401': {$ref: '#/components/responses/Problem'}
  /reports:
    post:
      summary: Criar denúncia para revisão manual
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReportInput'}
      responses:
        '201':
          description: Denúncia registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportReceipt'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /matchmaking/queues:
    post:
      summary: Entrar ou renovar presença na fila
      operationId: joinMatchmakingQueue
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinQueueInput'}
      responses:
        '201':
          description: Enfileirado ou pareado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueueStatus'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Sair da fila
      operationId: leaveMatchmakingQueue
      responses:
        '204': {description: Removido}
        '401': {$ref: '#/components/responses/Problem'}
  /matchmaking/bot-games:
    post:
      summary: Criar partida não ranqueada contra o bot autoritativo
      operationId: createBotGame
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBotGameInput'}
      responses:
        '201':
          description: Partida contra bot criada; inclui o primeiro lance quando o bot joga de brancas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameState'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /matchmaking/challenges:
    post:
      summary: Criar desafio direto
      operationId: createDirectChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateChallengeInput'}
      responses:
        '201': {description: Desafio pendente criado; se o desafiado for um bot social, já vem aceito com gameId}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /matchmaking/challenges/{challengeId}/respond:
    post:
      summary: Aceitar ou recusar desafio direto
      operationId: respondDirectChallenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RespondChallengeInput'}
      responses:
        '201': {description: Desafio resolvido; gameId presente quando aceito}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /games:
    get:
      summary: Listar histórico paginado do usuário
      operationId: listGameHistory
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: status, in: query, schema: {type: string}}
        - {name: result, in: query, schema: {type: string}}
        - {name: pool, in: query, schema: {$ref: '#/components/schemas/RatingPool'}}
        - {name: color, in: query, schema: {type: string, enum: [white, black]}}
        - {name: rated, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Página do histórico
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GameHistoryPage'}
    post:
      summary: Criar partida entre dois usuários ativos
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameInput'
      responses:
        '201':
          description: Partida criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Obter estado autorizado da partida
      operationId: getGame
      responses:
        '200':
          description: Estado canônico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /games/{gameId}/moves:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Listar lances persistidos
      operationId: listGameMoves
      responses:
        '200':
          description: Lances em ordem de ply
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameMove'
    post:
      summary: Propor e persistir um lance
      description: O servidor deriva SAN, FEN, turno, resultado e versão. O cliente envia somente UCI e idempotência.
      operationId: commitGameMove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMoveInput'
      responses:
        '201':
          description: Lance confirmado ou resposta idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitMoveResponse'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /games/{gameId}/review-annotations:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      summary: Listar anotações privadas da revisão
      operationId: listReviewAnnotations
