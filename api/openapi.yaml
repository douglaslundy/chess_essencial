                    properties:
                      index: {type: integer}
                      label: {type: string}
                      text: {type: string, maxLength: 900}
      responses:
        '204': {description: Aula salva}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/openings/pregenerate:
    post:
      summary: Gerar antes as aulas que faltam de uma família de abertura (até 40 linhas por chamada)
      operationId: adminPregenerateOpeningLessons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [family]
              properties:
                family: {type: string}
      responses:
        '202':
          description: Geração iniciada em segundo plano
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /openings/branches:
    get:
      summary: Lances do livro de aberturas depois de uma posição (lances jogados, em UCI)
      operationId: listOpeningBranches
      parameters:
        - {name: uci, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Próximos lances do livro, os mais comuns primeiro
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OpeningBranch'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /openings/due:
    get:
      summary: Aberturas treinadas que já estão na hora de repetir
      operationId: listDueOpenings
      responses:
        '200':
          description: Linhas a repetir
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OpeningLine'}
        '401': {$ref: '#/components/responses/Problem'}
  /openings:
    get:
      summary: Buscar linhas de abertura por família ou nome
      operationId: searchOpenings
      parameters:
        - {name: family, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Linhas encontradas (no máximo 200)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OpeningLine'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /openings/{openingId}:
    get:
      summary: Ler uma linha de abertura com a aula já gerada
      operationId: getOpening
      parameters:
        - {name: openingId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Linha, aula e próxima revisão
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /openings/{openingId}/lesson:
    post:
      summary: Gerar a aula da abertura (uma vez; depois é reaproveitada)
      operationId: requestOpeningLesson
      parameters:
        - {name: openingId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Estado atual da aula
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /openings/{openingId}/practice:
    post:
      summary: Registrar o resultado do treino da abertura e agendar a próxima repetição
      operationId: practiceOpening
      parameters:
        - {name: openingId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correct]
              properties:
                correct: {type: boolean}
      responses:
        '200':
          description: Data da próxima repetição
          content:
            application/json:
              schema:
                type: object
                required: [dueAt]
                properties:
                  dueAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /tutor/access:
    get:
      summary: Informar se o usuário tem o perfil de professor (o admin tem todos os perfis)
      operationId: getTutorAccess
      responses:
        '200':
          description: Acesso ao Tutor de IA
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
  /tutor/lessons/{kind}/{contentId}:
    get:
      summary: Ler a aula do Tutor de IA já gerada para um conteúdo (somente professor)
      operationId: getTutorLesson
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [library, exercise, review, lesson]}}
        - {name: contentId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Aula (status none quando ainda não existe)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TutorLesson'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /tutor/lessons:
    post:
      summary: Gerar (uma única vez por conteúdo) a aula quadro a quadro do Tutor de IA (somente professor)
      operationId: requestTutorLesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentId]
              properties:
                kind: {type: string, enum: [library, exercise, review, lesson]}
                contentId: {type: string}
                steps:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [say]
                    properties:
                      say: {type: string, maxLength: 600}
      responses:
        '201':
          description: Estado atual da aula
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TutorLesson'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /classrooms:
    get:
      summary: Listar as salas de aula em que o usuário é professor ou aluno
      operationId: listClassrooms
      responses:
        '200':
          description: Salas do usuário
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ClassroomSummary'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      summary: Criar uma sala de aula (quem cria é o professor)
      operationId: createClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Sala criada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomSummary'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /classrooms/{classroomId}:
    get:
      summary: Detalhar uma sala (professor, nome e alunos)
      operationId: getClassroom
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sala
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Apagar a sala (somente o professor)
      operationId: deleteClassroom
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Sala apagada}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /classrooms/{classroomId}/members:
    post:
      summary: Adicionar um aluno por usuário, e-mail ou id (somente o professor)
      operationId: addClassroomMember
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: {type: string, minLength: 1, maxLength: 254}
      responses:
        '204': {description: Aluno adicionado}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /classrooms/{classroomId}/members/{userId}:
    delete:
      summary: Remover um aluno da sala (somente o professor)
      operationId: removeClassroomMember
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Aluno removido}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /classrooms/{classroomId}/games/{gameId}:
    get:
      summary: Ver, só leitura, a partida que o professor está jogando
      operationId: getClassroomTeacherGame
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: gameId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Posição e lances da partida do professor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomGameView'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /classrooms/{classroomId}/live:
    get:
      summary: Página em que o professor está agora (os alunos consultam e acompanham)
      operationId: getClassroomLive
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Página atual do professor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomLive'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      summary: Publicar a página atual do professor (somente o professor)
      operationId: publishClassroomLive
      parameters:
        - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, maxLength: 300, pattern: '^/app(/[A-Za-z0-9._~%-]+)*(\?[A-Za-z0-9._~%=&-]*)?$'}
      responses:
        '204': {description: Página publicada}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebClientHeader:
      name: X-Xadrez-Client
      in: header
      required: false
      description: Use web para ativar a sessão com refresh em cookie HttpOnly
      schema: {type: string, enum: [web]}
    CsrfHeader:
      name: X-Xadrez-CSRF
      in: header
      required: false
      description: Obrigatório com valor 1 em refresh/logout autenticados por cookie
      schema: {type: string, enum: ['1']}
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LibraryGameSummary:
      type: object
      required: [black, blackElo, eco, event, id, openingFamily, openingName, playedOn, plyCount, result, white, whiteElo]
      properties:
        black: {type: string}
        blackElo: {type: [integer, 'null']}
        eco: {type: [string, 'null']}
        event: {type: [string, 'null']}
        id: {type: string, format: uuid}
        openingFamily: {type: [string, 'null']}
        openingName: {type: [string, 'null']}
        playedOn: {type: [string, 'null']}
        plyCount: {type: integer}
        result: {type: string, enum: ['1-0', '0-1', '1/2-1/2']}
        white: {type: string}
        whiteElo: {type: [integer, 'null']}
    LibraryGame:
      allOf:
        - $ref: '#/components/schemas/LibraryGameSummary'
        - type: object
          required: [movesSan, round, site]
          properties:
            movesSan: {type: array, items: {type: string}}
            round: {type: [string, 'null']}
            site: {type: [string, 'null']}
    LibrarySearchResult:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LibraryGameSummary'}}
        total: {type: integer}
    ClassroomSummary:
      type: object
      required: [id, name, role, teacherName, studentCount]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [teacher, student]}
        teacherName: {type: string}
        studentCount: {type: integer, minimum: 0}
    ClassroomMember:
      type: object
      required: [userId, username, displayName]
      properties:
        userId: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
    ClassroomDetail:
      allOf:
        - $ref: '#/components/schemas/ClassroomSummary'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: {$ref: '#/components/schemas/ClassroomMember'}
    OpeningFamily:
      type: object
      required: [family, lines, side]
      properties:
        family: {type: string}
        lines: {type: integer}
        side: {type: string, enum: [white, black]}
    AdminOpeningLesson:
      type: object
      required: [openingId, name, eco, family, status, overview, reviewed]
      properties:
        openingId: {type: string, format: uuid}
        name: {type: string}
        eco: {type: string}
        family: {type: string}
        status: {type: string, enum: [generating, completed, failed]}
        overview: {type: string}
        reviewed: {type: boolean}
    OpeningBranch:
      type: object
      required: [uci, lines, name, openingId]
      properties:
        uci: {type: string}
        lines: {type: integer}
        name: {type: string}
        openingId: {type: string, format: uuid}
    OpeningLine:
      type: object
      required: [id, eco, name, family, pgn, plyCount, side, moves]
      properties:
        id: {type: string, format: uuid}
        eco: {type: string}
        name: {type: string}
        family: {type: string}
        pgn: {type: string}
        plyCount: {type: integer}
        side: {type: string, enum: [white, black]}
        moves: {type: array, items: {type: string}}
    OpeningDetail:
      type: object
      required: [aiAvailable, dueAt, lesson, line]
      properties:
        aiAvailable: {type: boolean}
        dueAt: {type: string, format: date-time, nullable: true}
        line: {$ref: '#/components/schemas/OpeningLine'}
        lesson:
          type: object
          required: [status, overview, frames]
          properties:
            status: {type: string, enum: [none, generating, completed, failed]}
            overview: {type: string}
            reviewed: {type: boolean}
            frames:
              type: array
              items:
                type: object
                required: [index, label, text]
                properties:
                  index: {type: integer}
                  label: {type: string}
                  text: {type: string}
    TutorLesson:
      type: object
      required: [status, frames, totalSteps]
      properties:
        status: {type: string, enum: [none, generating, completed, failed]}
        totalSteps: {type: integer}
        frames:
          type: array
          items:
            type: object
            required: [index, label, text]
            properties:
              index: {type: integer}
              label: {type: string}
              text: {type: string}
    ClassroomGameView:
      type: object
      required: [white, black, fen, sideToMove, status, result, moves]
      properties:
        white: {type: string}
        black: {type: string}
        fen: {type: string}
        sideToMove: {type: string, enum: [white, black]}
        status: {type: string}
        result: {type: string, enum: [white_win, black_win, draw, none]}
        moves:
          type: array
          items:
            type: object
            required: [ply, san, from, to]
            properties:
              ply: {type: integer}
              san: {type: string}
              from: {type: string}
              to: {type: string}
    ClassroomLive:
      type: object
      required: [path, seq]
      properties:
        path: {type: string, maxLength: 300}
        seq: {type: integer}
    PlayerMetrics:
      type: object
      required: [gamesPlayed, wins, draws, losses, timePlayedSeconds, analyzedGames, quality, strengths, weaknesses, summary]
      properties:
        gamesPlayed: {type: integer, minimum: 0}
        wins: {type: integer, minimum: 0}
        draws: {type: integer, minimum: 0}
        losses: {type: integer, minimum: 0}
        timePlayedSeconds: {type: integer, minimum: 0}
        analyzedGames: {type: integer, minimum: 0}
        quality:
          type: object
          required: [bom, erro, excelente, gafe, imprecisao, missedWin, otimo]
          properties:
            bom: {type: integer, minimum: 0}
            erro: {type: integer, minimum: 0}
            excelente: {type: integer, minimum: 0}
            gafe: {type: integer, minimum: 0}
            imprecisao: {type: integer, minimum: 0}
            missedWin: {type: integer, minimum: 0}
            otimo: {type: integer, minimum: 0}
        strengths:
          type: array
          items: {type: string}
        weaknesses:
          type: array
          items: {type: string}
        summary: {type: string}
    GameStudyPlan:
      type: object
      required: [themes, exercises, libraryGames]
      properties:
        themes:
          type: array
          items:
            type: object
            required: [key, label, reason, hasExercises]
            properties:
              key: {type: string}
              label: {type: string}
              reason: {type: string}
              hasExercises: {type: boolean}
        exercises:
          type: array
          items:
            type: object
            required: [id, title, difficulty, theme, done]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              difficulty: {type: string, nullable: true}
              theme: {type: string}
              done: {type: boolean}
        libraryGames:
          type: array
          items:
            type: object
            required: [id, title, focus, done]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              focus: {type: string}
              done: {type: boolean}
    CourseTrailProgress:
      type: object
      required: [completedActivityIds]
      properties:
        completedActivityIds:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,80}$'}
    LibraryFacets:
      type: object
      required: [openings, players]
      properties:
        openings: {type: array, items: {$ref: '#/components/schemas/LibraryFacetItem'}}
        players: {type: array, items: {$ref: '#/components/schemas/LibraryFacetItem'}}
    LibraryFacetItem:
      type: object
      required: [count, name]
      properties:
        count: {type: integer}
        name: {type: string}
    LibraryReviewEntry:
      type: object
      required: [better, betterWhy, expect, ply, strength, summary, weakness, why]
      properties:
        better: {type: [string, 'null']}
        betterWhy: {type: [string, 'null']}
        expect: {type: [string, 'null']}
        ply: {type: integer}
        strength: {type: [string, 'null']}
        summary: {type: string}
        weakness: {type: [string, 'null']}
        why: {type: string}
    LibraryReview:
      type: object
      required: [aiAvailable, entries, status, totalPlies]
      properties:
        aiAvailable: {type: boolean}
        entries: {type: array, items: {$ref: '#/components/schemas/LibraryReviewEntry'}}
        status: {type: string, enum: [none, generating, completed, failed]}
        totalPlies: {type: integer}
    SubscriptionPayment:
      type: object
      required: [amountCents, billingPeriod, currency, id, paidAt, provider, status]
      properties:
        amountCents: {type: integer}
        billingPeriod: {type: string, enum: [monthly, annual]}
        currency: {type: string}
        id: {type: string, format: uuid}
        paidAt: {type: [string, 'null'], format: date-time}
        provider: {type: string}
        status: {type: string, enum: [pending, approved, rejected, cancelled, refunded, expired]}
    SubscriptionPaymentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SubscriptionPayment'}}
    AiVoiceId:
      type: string
      enum: ['openai:marin', 'openai:cedar']
    AiVoiceOption:
      type: object
      required: [id, label, provider]
      properties:
        id: {$ref: '#/components/schemas/AiVoiceId'}
        label: {type: string}
        provider: {type: string, const: openai}
    AiVoiceOptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AiVoiceOption'}
    SynthesizeSpeechInput:
      type: object
      required: [text, voice]
      properties:
        text: {type: string, minLength: 1, maxLength: 1000}
        voice: {$ref: '#/components/schemas/AiVoiceId'}
      additionalProperties: false
    LiveNarrationRequest:
      oneOf:
        - type: object
          required: [kind, bestMoveUci, mate, scoreCp]
          properties:
            kind: {type: string, const: suggestion}
            bestMoveUci: {type: string}
            mate: {type: [integer, 'null']}
            principalVariation:
              type: array
              maxItems: 7
              default: []
              items: {type: string, pattern: '^[a-h][1-8][a-h][1-8][qrbn]?$'}
            scoreCp: {type: [integer, 'null']}
        - type: object
          required: [kind, uci, bestMoveUci, quality, centipawnLoss, missedWin]
          properties:
            kind: {type: string, const: quality}
            uci: {type: string}
            bestMoveUci: {type: [string, 'null']}
            quality: {$ref: '#/components/schemas/MoveQuality'}
            centipawnLoss: {type: integer}
            missedWin: {type: boolean}
      discriminator: {propertyName: kind}
    LiveNarrationResult:
      type: object
      required: [narrative]
      properties:
        narrative: {type: [string, 'null']}
    LearningStageStatus:
      type: string
      enum: [locked, available, completed]
    LearningStageType:
      type: string
      enum: [challenge, lesson, review, checkpoint, boss]
    LearningLevelStatus:
      type: string
      enum: [locked, current, completed]
    LearningStageSummary:
      type: object
      required: [id, position, status, type]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        status: {$ref: '#/components/schemas/LearningStageStatus'}
        type: {$ref: '#/components/schemas/LearningStageType'}
    LearningLevelSummary:
      type: object
      required: [completedStageCount, id, isCapstone, position, stageCount, status, title]
      properties:
        completedStageCount: {type: integer}
        id: {type: string, format: uuid}
