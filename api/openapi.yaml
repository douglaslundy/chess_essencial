      properties:
        ply: {type: integer, minimum: 1}
        color: {type: string, enum: [white, black]}
        san: {type: string}
        uci: {type: string}
        scoreBeforeCp: {type: [integer, 'null']}
        mateBefore: {type: [integer, 'null']}
        scoreAfterCp: {type: [integer, 'null']}
        mateAfter: {type: [integer, 'null']}
        bestMoveUci: {type: [string, 'null']}
        centipawnLoss: {type: integer}
        quality: {$ref: '#/components/schemas/MoveQuality'}
        missedWin: {type: boolean}
    GameAnalysisQualityCounts:
      type: object
      required: [otimo, excelente, bom, imprecisao, erro, gafe, missedWin]
      properties:
        otimo: {type: integer, minimum: 0}
        excelente: {type: integer, minimum: 0}
        bom: {type: integer, minimum: 0}
        imprecisao: {type: integer, minimum: 0}
        erro: {type: integer, minimum: 0}
        gafe: {type: integer, minimum: 0}
        missedWin: {type: integer, minimum: 0}
    GameErrorSignal:
      type: object
      required: [id, ply, skillKey, skillLabel, taxonomyVersion, signalType, confidence, ruleVersion, evidence, recommendation]
      properties:
        id: {type: string, format: uuid}
        ply: {type: integer, minimum: 1}
        skillKey: {type: string}
        skillLabel: {type: string}
        taxonomyVersion: {type: integer, minimum: 1}
        signalType: {type: string, enum: [missed_opportunity, unsafe_move]}
        confidence: {type: number, minimum: 0, maximum: 1}
        ruleVersion: {type: string}
        evidence:
          type: object
          required: [centipawnLoss, missedWin, quality]
          properties:
            centipawnLoss: {type: integer}
            missedWin: {type: boolean}
            quality: {$ref: '#/components/schemas/MoveQuality'}
        recommendation:
          type: [object, 'null']
          required: [exerciseId, exerciseTitle, rationale]
          properties:
            exerciseId: {type: string, format: uuid}
            exerciseTitle: {type: string}
            rationale: {type: string}
    GameAnalysis:
      type: object
      required: [status, summary, moves, errorSignals]
      properties:
        status: {type: string, enum: [pending, processing, completed, failed]}
        summary:
          type: [object, 'null']
          required: [white, black]
          properties:
            white: {$ref: '#/components/schemas/GameAnalysisQualityCounts'}
            black: {$ref: '#/components/schemas/GameAnalysisQualityCounts'}
        moves: {type: array, items: {$ref: '#/components/schemas/GameMoveAnalysis'}}
        errorSignals: {type: array, items: {$ref: '#/components/schemas/GameErrorSignal'}}
    GameNarrationKeyMoment:
      type: object
      required: [ply, color, san, quality, narrative]
      properties:
        ply: {type: integer, minimum: 1}
        color: {type: string, enum: [white, black]}
        san: {type: string}
        quality: {$ref: '#/components/schemas/MoveQuality'}
        narrative: {type: string}
    GameNarration:
      type: object
      required: [status, summary, keyMoments, patterns, studyPlan]
      properties:
        status: {type: string, enum: [pending, processing, completed, failed]}
        summary: {type: [string, 'null']}
        keyMoments: {type: array, items: {$ref: '#/components/schemas/GameNarrationKeyMoment'}}
        patterns: {type: array, items: {type: string}}
        studyPlan: {type: array, items: {type: string}}
    GameMove:
      type: object
      required: [id, ply, color, clientMoveId, uci, san, from, to, promotion, fenBefore, fenAfter, flags, committedAt]
      properties:
        id: {type: integer, minimum: 1}
        ply: {type: integer, minimum: 1}
        color: {type: string, enum: [white, black]}
        clientMoveId: {type: string, format: uuid}
        uci: {type: string}
        san: {type: string}
        from: {type: string, minLength: 2, maxLength: 2}
        to: {type: string, minLength: 2, maxLength: 2}
        promotion: {type: [string, 'null']}
        fenBefore: {type: string}
        fenAfter: {type: string}
        flags: {type: object}
        committedAt: {type: string, format: date-time}
      additionalProperties: false
    CommitMoveResponse:
      type: object
      required: [move, state]
      properties:
        move: {$ref: '#/components/schemas/GameMove'}
        state: {$ref: '#/components/schemas/GameState'}
      additionalProperties: false
