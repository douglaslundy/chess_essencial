name: xadrez-essencial

x-app-defaults: &app-defaults
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  # S3-compatible object storage for user uploads (avatars now; feed photos
  # later). Isolated to this project with its own volume and credentials.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data

  # One-shot job that creates the public-read avatars bucket on startup.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$MINIO_BUCKET" &&
        mc anonymous set download local/"$MINIO_BUCKET" &&
        echo "bucket $MINIO_BUCKET ready"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT}:1025'
      - '${MAILPIT_UI_PORT}:8025'

  api:
    <<: *app-defaults
    image: xadrez-api:${IMAGE_TAG:-local}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      API_PORT: 4000
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET}
      AUTH_EXPOSE_VERIFICATION_TOKEN: ${AUTH_EXPOSE_VERIFICATION_TOKEN}
      AUTH_IP_HASH_SECRET: ${AUTH_IP_HASH_SECRET}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET}
      AUTH_VERIFICATION_SECRET: ${AUTH_VERIFICATION_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      METRICS_TOKEN: ${METRICS_TOKEN}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: 'false'
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      WEB_ORIGIN: ${WEB_ORIGIN}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - '${API_PORT}:4000'

  worker:
    <<: *app-defaults
    image: xadrez-worker:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      WORKER_HEALTH_PORT: 4001
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - '${WORKER_PORT}:4001'

  web:
    <<: *app-defaults
    image: xadrez-web:${IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - '${WEB_PORT}:3000'

volumes:
  minio_data:
  postgres_data:
  redis_data:
