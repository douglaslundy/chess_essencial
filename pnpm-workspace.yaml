packages:
  - apps/*
  - packages/*

allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

catalog:
  '@eslint/js': 9.39.5
  '@types/node': 26.1.1
  eslint: 9.39.5
  eslint-config-prettier: 10.1.8
  prettier: 3.9.5
  typescript: 6.0.3
  typescript-eslint: 8.64.0
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAgeExclude:
  - bullmq@5.80.5
